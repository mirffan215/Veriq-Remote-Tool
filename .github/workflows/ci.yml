name: ci
on: [push, pull_request]
jobs:
  test-portable:            # Core, Relay, Capture, Input: platform-neutral tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test tests/RemoteTool.Core.Tests -c Release
      - run: dotnet test tests/RemoteTool.Relay.Tests -c Release
      - run: dotnet test tests/RemoteTool.Capture.Tests -c Release
      - name: Vulnerable packages (per project; a scan that cannot run fails the job)
        run: |
          set -e
          for p in $(find src tests tools -name '*.csproj' ! -path '*RemoteTool.App*'); do
            out=$(dotnet list "$p" package --vulnerable --include-transitive 2>&1) || { echo "$out"; exit 1; }
            echo "$out" | grep -q "has the following vulnerable packages" && { echo "$out"; exit 1; }
            echo "$p: clean"
          done
      - name: Tile codec benchmark (Linux numbers)
        run: dotnet run -c Release --project tools/RemoteTool.Bench | tee bench-linux.md
      - uses: actions/upload-artifact@v4
        with: { name: bench-linux, path: bench-linux.md }
  codec-benchmark-windows:   # real Media Foundation numbers (H.264 vs tiles) on a Windows runner
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Try to enable Media Foundation (Server SKUs ship without it)
        shell: pwsh
        run: Install-WindowsFeature Server-Media-Foundation -ErrorAction SilentlyContinue
      - run: dotnet run -c Release --project tools/RemoteTool.Bench | Tee-Object -FilePath bench-windows.md
      - uses: actions/upload-artifact@v4
        with: { name: bench-windows, path: bench-windows.md }
  build-windows:            # the WPF app can only be built with the Windows Desktop SDK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: ./scripts/publish-app.ps1
      - uses: actions/upload-artifact@v4
        with: { name: RemoteTool-unsigned, path: artifacts/app/RemoteTool.exe }
      - name: Build the deployable package (single exe + sha256 + zip)
        run: dotnet build deploy/RemoteTool.Package -c Release
      - uses: actions/upload-artifact@v4
        with: { name: RemoteTool-package, path: artifacts/RemoteTool-*-win-x64.zip }
